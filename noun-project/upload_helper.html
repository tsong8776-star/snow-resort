const KEY = "np-upload-done";
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const saveDone = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
let filter = "전체";
const sets = ["전체", ...new Set(ITEMS.map(i => i.set))];
function copy(text, btn) {
  const ok = () => { const o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => fallback(text, ok)); else fallback(text, ok);
}
function fallback(text, ok) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} t.remove(); }
function download(it) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([it.svg], { type: "image/svg+xml" }));
  a.download = it.file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function render() {
  const f = document.getElementById("filters"); f.innerHTML = "";
  sets.forEach(s => { const b = document.createElement("button"); b.textContent = s; if (s === filter) b.className = "on"; b.onclick = () => { filter = s; render(); }; f.appendChild(b); });
  const list = ITEMS.filter(i => filter === "전체" || i.set === filter);
  const p = document.createElement("span"); p.className = "prog"; p.textContent = `완료 ${list.filter(i => done[i.set + i.file]).length} / ${list.length}`; f.appendChild(p);
  const g = document.getElementById("grid"); g.innerHTML = "";
  list.forEach(it => {
    const id = it.set + it.file, c = document.createElement("div"); c.className = "card" + (done[id] ? " done" : "");
    c.innerHTML = `<div class="ico">${it.svg}</div><div class="n">${it.set} · ${it.file}</div><div class="t"></div><div class="tags"></div>
      <div class="row"><button class="primary" data-a="dl">SVG 초안 받기</button><button data-a="t">제목 복사</button><button data-a="g">태그 복사</button></div>
      <label><input type="checkbox" ${done[id] ? "checked" : ""}> 업로드 완료</label>`;
    c.querySelector(".t").textContent = it.title; c.querySelector(".tags").textContent = it.tags;
    c.querySelector('[data-a="dl"]').onclick = () => download(it);
    c.querySelector('[data-a="t"]').onclick = e => copy(it.title, e.target);
    c.querySelector('[data-a="g"]').onclick = e => copy(it.tags, e.target);
    c.querySelector("input").onchange = e => { done[id] = e.target.checked; saveDone(); render(); };
    g.appendChild(c);
  });
}
render();
</script></body></html>
